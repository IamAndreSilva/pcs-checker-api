spring.application.name=pcs-checker-api

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pcschecker
spring.datasource.username=postgres
spring.datasource.password=secret

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Session
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# TMDB
tmdb.api.key=${TMDB_API_KEY:changeme}
tmdb.image.base-url=https://image.tmdb.org/t/p/w500

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL (for CORS + OAuth redirect)
app.frontend-url=http://localhost:5173

# Logging
logging.level.nl.andresilva=DEBUG
