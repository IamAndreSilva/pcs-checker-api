apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcs-checker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - PCS_HOST
      secretName: pcs-checker-tls
  rules:
    - host: PCS_HOST
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
