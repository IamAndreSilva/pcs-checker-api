# The pcs-checker-secrets Secret is created out of band (see README) and is
# deliberately not part of this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pcs-checker

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/iamandresilva/pcs-checker-api
    newTag: 1424dc8a05c433d4a289e0484c4e90a264d511d2
  - name: ghcr.io/iamandresilva/pcs-checker-ui
    newTag: fcb285f3a6f0bf2d76c5a182104f245af555be94

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://stingercheck.com
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=true
